name: Deploy ke GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya izinkan 1 deployment berjalan sekaligus. Kalau ada deployment baru,
# batalkan yang sedang berjalan (tidak cancel yang sudah selesai).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload seluruh isi folder root (semua file HTML, JS, JSON, icon)
          path: '.'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
