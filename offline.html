<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4A3018">
    <title>Offline — Faminis Barokah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #4A3018 0%, #6F4E37 50%, #8B5A2B 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
            color: #FDF8F3;
            text-align: center;
        }

        .container {
            max-width: 360px;
            width: 100%;
        }

        .icon-wrap {
            width: 100px;
            height: 100px;
            background: rgba(253, 248, 243, 0.12);
            border: 2px solid rgba(253, 248, 243, 0.25);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            font-size: 48px;
            backdrop-filter: blur(10px);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #FDF8F3;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(253, 248, 243, 0.78);
            margin-bottom: 10px;
        }

        .divider {
            width: 48px;
            height: 3px;
            background: rgba(253, 248, 243, 0.3);
            border-radius: 99px;
            margin: 20px auto;
        }

        .tips {
            background: rgba(253, 248, 243, 0.1);
            border: 1px solid rgba(253, 248, 243, 0.18);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 28px;
            text-align: left;
        }

        .tips p {
            font-size: 13px;
            color: rgba(253, 248, 243, 0.85);
            margin: 0;
        }

        .tips ul {
            margin-top: 10px;
            padding-left: 18px;
            list-style: disc;
        }

        .tips li {
            font-size: 13px;
            color: rgba(253, 248, 243, 0.8);
            line-height: 1.7;
        }

        .btn-retry {
            display: block;
            width: 100%;
            padding: 16px;
            background: #FDF8F3;
            color: #4A3018;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-retry:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-retry span {
            display: inline-block;
            margin-right: 8px;
            font-size: 18px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #EF4444;
            margin-right: 6px;
            vertical-align: middle;
            animation: blink 1.2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(253, 248, 243, 0.6);
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon-wrap">📡</div>

        <h1>Tidak Ada Koneksi</h1>
        <p>HP kamu sedang offline. Sambungkan ke Wi-Fi atau data seluler, lalu coba buka lagi.</p>

        <div class="divider"></div>

        <div class="tips">
            <p>💡 <strong>Yang bisa dilakukan:</strong></p>
            <ul>
                <li>Aktifkan Wi-Fi atau data seluler</li>
                <li>Kalau sinyal lemah, coba pindah lokasi</li>
                <li>Data transaksi yang sudah tersimpan di server aman</li>
            </ul>
        </div>

        <button class="btn-retry" onclick="cobaSambung()">
            <span>🔄</span> Coba Sambung Lagi
        </button>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span id="status-teks">Sedang offline...</span>
        </div>
    </div>

    <script>
        function cobaSambung() {
            window.location.reload();
        }

        // Auto-redirect ke halaman utama begitu online kembali
        window.addEventListener('online', function () {
            document.getElementById('status-teks').textContent = 'Koneksi kembali! Membuka aplikasi...';
            document.querySelector('.status-dot').style.background = '#22C55E';
            setTimeout(function () {
                window.location.replace('./');
            }, 800);
        });

        // Update status offline/online secara real-time
        function updateStatus() {
            if (navigator.onLine) {
                document.getElementById('status-teks').textContent = 'Koneksi terdeteksi! Membuka...';
                document.querySelector('.status-dot').style.background = '#22C55E';
                setTimeout(function () { window.location.replace('./'); }, 500);
            }
        }

        // Cek status setiap 3 detik (polite polling)
        setInterval(updateStatus, 3000);
    </script>
</body>

</html>
